name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package all loaders
        run: bash ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: lookingglass2-development-${{ github.sha }}
          if-no-files-found: error
          path: |
            fabric/build/libs/lookingglass2-*+1.20.1-fabric.jar
            forge/build/libs/lookingglass2-*+1.20.1-forge.jar
            neoforge/build/libs/lookingglass2-*+1.20.1-neoforge.jar
