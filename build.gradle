plugins {
    id 'architectury-plugin' version '3.4.162'
    id 'dev.architectury.loom' version '1.6.422' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}
architectury { minecraft = minecraft_version }
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}
subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'java-library'
    base { archivesName = "${rootProject.archives_base_name}-${project.name}" }
    repositories {
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.neoforged.net/releases/' }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { rename { 'LICENSE_LookingGlass2' } }
        from(rootProject.file('NOTICE.md'))
    }
}
